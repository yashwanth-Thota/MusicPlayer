plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android-extensions' // the code uses kotlinx.android.synthetic view access
}

android {
    namespace 'com.example.yashwanth.echo'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.example.yashwanth.echo"
        minSdk 21
        // 28, not newer: the original code builds PendingIntents with flags 0, which crashes on targetSdk 31+.
        // Newer phones still install and run it; they map READ_EXTERNAL_STORAGE to the media permission.
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    buildTypes {
        release { minifyEnabled false }
    }
    lint { abortOnError false }
}

dependencies {
    implementation 'com.android.support:appcompat-v7:26.1.0'
    implementation 'com.android.support:design:26.1.0'
    implementation 'com.android.support:recyclerview-v7:26.1.0'
    implementation 'com.android.support:cardview-v7:26.1.0'
    implementation 'com.android.support:support-v4:26.1.0'
    implementation 'com.cleveroad:audiovisualization:0.9.4'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.7.22'
}
